<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Trascrizione completata, tema chiaro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0}
.vrsl{--bg:#f4f4f4;--pn:#ffffff;--rs:#e8e8e8;--ln:#d4d4d4;--tx:#141414;--dm:#595959;--ft:#6b6b6b;--ac:#141414;--ai:#ffffff;--er:#b92f2a;--wn:#8f5400;--sel:#e4e4e4;--wv:#b3b3b3;width:1440px;height:900px;box-sizing:border-box;background:var(--bg);color:var(--tx);font:13px/1.35 "IBM Plex Sans",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
.vrsl *{box-sizing:border-box}
.vrsl .m{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.vrsl .r{display:flex;align-items:center}
.vrsl .d{color:var(--dm)}
.vrsl button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.vrsl .b{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px;border-radius:4px;color:var(--dm);white-space:nowrap}
.vrsl .b.o{border:1px solid var(--ln);color:var(--tx)}
.vrsl .b.p{background:var(--ac);color:var(--ai);font-weight:600}
.vrsl .i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.vrsl .k{font:11px "IBM Plex Mono",monospace;color:var(--ft)}
.vrsl .lb{font-size:11px;color:var(--ft);font-weight:500}
.vrsl .h{font-size:12px;font-weight:600;letter-spacing:.01em}
.vrsl .c{padding:0 12px;height:36px;display:flex;align-items:center;border-bottom:1px solid var(--ln);overflow:hidden;white-space:nowrap}
</style>
</helmet>
<div class="vrsl">

<header class="r" style="height:40px;flex:none;background:var(--pn);border-bottom:1px solid var(--ln);padding:0 10px">
<div class="r" style="gap:2px;flex:1">
<button class="r" style="height:40px;padding:0 12px;gap:8px;border-bottom:2px solid var(--ac)"><span>matteo scpt final.mov</span><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:12px;height:12px;color:var(--ft)"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
<button class="b" aria-label="Nuovo progetto"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
</div>
<nav class="r" style="gap:4px">
<button class="r" style="height:40px;padding:0 14px;gap:8px;border-bottom:2px solid var(--ac);font-weight:500">Trascrizione</button>
<button class="r d" style="height:40px;padding:0 14px;gap:8px">Editor<span title="L'editor contiene sottotitoli" style="width:6px;height:6px;border-radius:50%;background:var(--ac)"></span></button>
<button class="r d" style="height:40px;padding:0 14px;gap:8px">Esportazione</button>
</nav>
<div class="r" style="flex:1;justify-content:flex-end">
<button class="b" aria-label="Passa al tema scuro"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>Chiaro</button>
</div>
</header>

<section class="r" style="flex:none;padding:28px 40px;gap:20px;border-bottom:1px solid var(--ln);background:var(--pn)">
<span style="width:44px;height:44px;border:1px solid var(--ac);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--ac);flex:none"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:22px;height:22px"><path d="M5 12l5 5 9-10"/></svg></span>
<div style="min-width:0">
<div style="font-size:22px;font-weight:500">Trascrizione completata</div>
<div class="r" style="gap:12px;margin-top:4px"><span class="m d">14 sottotitoli · matteo scpt final.mov</span>
<span class="r" style="gap:6px;color:var(--wn);font-size:12px"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><path d="M12 4l9 16H3zM12 10v4M12 17v.5"/></svg>Versione modificata nell'editor</span></div>
</div>
<div class="r" style="margin-left:auto;gap:8px">
<button class="b o" style="height:36px;padding:0 14px">Nuova trascrizione<span class="k">⌘N</span></button>
<button class="b o" style="height:36px;padding:0 14px"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V9M7 14l5-5 5 5M5 3h14"/></svg>Esporta SRT<span class="k">⌘S</span></button>
<button class="b p" style="height:36px;padding:0 16px;font-size:14px">Apri nell'editor<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
</div>
</section>

<main style="flex:1;min-height:0;padding:20px 40px 0">
<div class="r" style="justify-content:space-between;margin-bottom:6px"><span class="h">Anteprima</span><span class="d" style="font-size:12px">Trascrizione originale, sola lettura</span></div>
<div style="display:grid;grid-template-columns:56px 120px 120px minmax(0,1fr)">
<div class="c lb" style="height:30px">#</div><div class="c lb" style="height:30px">Inizio</div><div class="c lb" style="height:30px">Fine</div><div class="c lb" style="height:30px">Testo</div>
<sc-for list="{{rows}}" as="x" hint-placeholder-count="14">
<div class="c m" style="color:var(--ft)">{{x.n}}</div><div class="c m d">{{x.a}}</div><div class="c m d">{{x.z}}</div><div class="c" style="font-size:14px"><span style="overflow:hidden;text-overflow:ellipsis">{{x.t}}</span></div>
</sc-for>
</div>
</main>

<footer class="r m" style="height:26px;flex:none;padding:0 12px;gap:16px;font-size:11px;border-top:1px solid var(--ln);background:var(--pn);color:var(--dm)">
<span>Completato · 14 sottotitoli</span>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
var subs = [[0.0, 2.9, 'Buongiorno Marta, grazie di essere qui'], [3.1, 6.0, 'Oggi parliamo di sottotitoli, e di'], [6.24, 8.24, 'come funziona davvero la trascrizione automatica'], [8.7, 11.4, 'Partiamo dal modello: cosa ascolta, esattamente?'], [12.9, 15.6, 'Ascolta tutto, anche i silenzi'], [15.8, 18.9, 'ed è lì che nascono le frasi inventate'], [19.2, 21.0, 'Davvero?'], [21.4, 24.6, 'Per questo il filtro VAD toglie le pause'], [26.3, 29.8, 'prima ancora che il modello le senta'], [30.0, 32.2, 'Poi arriva la parte che preferisco: i tempi'], [32.4, 36.0, 'Ogni parola ha un inizio e una fine'], [36.1, 39.4, 'e il sottotitolo si chiude quando chi parla respira'], [40.2, 43.5, 'Quindi meno lavoro a mano, dopo'], [44.0, 48.9, 'Molto meno. Ma una rilettura serve sempre']];
function tc(s) { var m = Math.floor(s / 60), r = (s - m * 60).toFixed(3); return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r; }
return { rows: subs.map(function (s, i) { return { n: i + 1, a: tc(s[0]), z: tc(s[1]), t: s[2] }; }) };
}
}
</script>
</body>
</html>
