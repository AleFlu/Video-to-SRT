name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python-version: ["3.11"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Librerie di runtime richieste da Qt/PySide6 in modalità offscreen
      - name: Librerie Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libpulse0 libfontconfig1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 \
            libxcb-shape0 libxrender1 libxi6 libxcomposite1 libxdamage1 libxfixes3 libxtst6

      # Il runner Linux non ha audio: il player (backend FFmpeg di Qt) riceve una scheda
      # audio finta, come su un PC vero, invece di nessun dispositivo.
      - name: Audio finto (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils
          pulseaudio -D --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_null
          pactl set-default-sink ci_null

      # faster-whisper non serve: i test non caricano il modello
      - name: Installa dipendenze
        run: python -m pip install --upgrade pip PySide6 numpy soundfile pytest ruff

      - name: Lint (ruff)
        run: ruff check app

      # -v: in caso di crash nativo (segfault/abort) il log mostra quale test era in corso
      - name: Test (pytest)
        run: python -X faulthandler -m pytest -v
