name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS e Windows: stessa versione di Python delle build distribuite
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"
          # Linux (solo CI, non distribuito): con Python 3.11 PySide 6.12 toglie riferimenti
          # a None quando Qt chiama le funzioni Python (enum convertiti) finché il processo si
          # ferma con "deallocating None". Da Python 3.12 None è immortale: nessun crash.
          - os: ubuntu-latest
            python-version: "3.12"
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Librerie di runtime richieste da Qt/PySide6 in modalità offscreen
      - name: Librerie Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libpulse0 libfontconfig1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 \
            libxcb-shape0 libxrender1 libxi6 libxcomposite1 libxdamage1 libxfixes3 libxtst6

      # faster-whisper non serve: i test non caricano il modello
      - name: Installa dipendenze
        run: python -m pip install --upgrade pip PySide6 numpy soundfile pyspellchecker pytest ruff

      - name: Lint (ruff)
        run: ruff check app

      # -v: in caso di crash nativo (segfault/abort) il log mostra quale test era in corso
      - name: Test (pytest)
        run: python -m pytest -v

